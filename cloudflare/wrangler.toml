#:schema node_modules/wrangler/config-schema.json
name = "splayer-api"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 允许访问 Node.js API（fetch、TextEncoder 等）
# workers_dev = true  # 默认启用，使用 *.workers.dev 子域名

# ── 自定义域名（取消注释并填入你的域名）──────────────────────────────────
# routes = [
#   { pattern = "api.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# ── 环境变量（可选）────────────────────────────────────────────────────────
# [vars]
# LOG_LEVEL = "warn"

# ── 限流（可选，单位：请求/分钟）───────────────────────────────────────────
# [[unsafe.bindings]]
# name = "RATE_LIMIT"
# type = "ratelimit"
# namespace_id = "xxxx"
# total_count = 120
# window = 60
