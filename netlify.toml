# ── 使用 Cloudflare Workers 后端时，取消下方注释并替换为你的 Worker 地址 ──────
# [[redirects]]
#   from = "/api/*"
#   to = "https://splayer-api.workers.dev/api/:splat"
#   status = 200

[build]
  command = "pnpm run build"
  publish = "out/renderer"

[[redirects]]
  from = "/api/ttml/*"
  to = "https://lyrics.focalors.ltd/:splat"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://music-api.focalors.ltd/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
